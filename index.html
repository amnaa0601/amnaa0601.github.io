```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Hassan</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: 'Quicksand', sans-serif;

            background:
                radial-gradient(circle at top left, #fff1f5, transparent 40%),
                radial-gradient(circle at bottom right, #eee7ff, transparent 40%),
                #faf8ff;
        }

        .card {
            width: 100%;
            max-width: 430px;
            min-height: 300px;

            background: rgba(255, 255, 255, 0.92);

            border-radius: 28px;

            padding: 45px 30px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            box-shadow: 0 15px 40px rgba(100, 80, 120, 0.12);

            transition: all 0.5s ease;
        }

        .front h1 {
            margin: 0 0 30px;

            font-size: 32px;
            font-weight: 700;

            color: #705c82;
        }

        .open-button {
            border: none;

            padding: 14px 30px;

            border-radius: 50px;

            background: #b9a4ce;
            color: white;

            font-family: 'Quicksand', sans-serif;

            font-size: 17px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow: 0 6px 15px rgba(120, 90, 140, 0.18);
        }

        .open-button:hover {
            transform: translateY(-2px);
            background: #a88fbe;
        }

        .message {
            display: none;
            animation: fadeIn 0.8s ease;
        }

        .message h2 {
            margin: 0 0 28px;

            font-size: 36px;
            font-weight: 700;

            color: #705c82;
        }

        .message p {
            margin: 12px 0;

            font-size: 21px;
            line-height: 1.7;

            font-weight: 500;

            color: #55505b;
        }

        .message .question {
            margin-top: 28px;

            font-size: 23px;
            font-weight: 700;

            color: #806695;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {

            .card {
                padding: 40px 25px;
            }

            .front h1 {
                font-size: 28px;
            }

            .message h2 {
                font-size: 32px;
            }

            .message p {
                font-size: 19px;
            }

            .message .question {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- FIRST SCREEN -->

        <div class="front" id="front">

            <h1>For Hassan</h1>

            <button class="open-button" onclick="openMessage()">
                Open it
            </button>

        </div>


        <!-- MESSAGE INSIDE THE CARD -->

        <div class="message" id="message">

            <h2>Hassannn</h2>

            <p>
                I’m genuinely sorryyyy for what I did.
            </p>

            <p>
                I know I’ve hurt you a lot.
            </p>

            <p class="question">
                Can you just give us one last chance pleaseeeeee?
            </p>

        </div>

    </div>


    <script>

        function openMessage() {

            document.getElementById("front").style.display = "none";

            document.getElementById("message").style.display = "block";

        }

    </script>

</body>
</html>
```
